name: Build macOS App
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Universal DMG
        run: |
          cd mac
          chmod +x build_mac.sh
          ./build_mac.sh
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuhiBrowser_macOS
          path: mac/build/RuhiBrowser.dmg
