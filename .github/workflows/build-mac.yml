name: Build and Test macOS App (RUHI Browser)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-test-mac:
    name: Build & Test Native macOS App
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Build and Package App
        working-directory: mac
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: Launch App & Capture Multi-Screen Screenshots
        working-directory: mac
        run: |
          chmod +x take_screenshots.sh
          ./take_screenshots.sh

      - name: Upload Artifacts (DMG & Screenshots Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: RuhiBrowser_macOS_Test_Bundle
          path: |
            mac/RuhiBrowser_macOS.dmg
            mac/Release_App
            mac/screenshots/*.png
          if-no-files-found: warn
